[project]
name = "wikiquiz-gen"
version = "0.1.0"
description = "Fragen-Generator für WikiQuiz (Wikidata + Wikipedia)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
wikiquiz-gen = "wikiquiz_gen.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wikiquiz_gen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
