name: Fragen generieren

# Manuell starten: Actions → „Fragen generieren“ → Run workflow.
# Pro Kategorie entsteht ein eigener Pull Request mit Stichprobe zur Prüfung.
on:
  workflow_dispatch:
    inputs:
      kategorie:
        description: Kategorie
        type: choice
        default: alle
        options: [alle, naturwissenschaften, kunst, geschichte, sport, geografie, essen, natur, schweiz, starwars]
      quelle:
        description: Quelle
        type: choice
        default: wikipedia
        options: [wikipedia, wikidata, alle]
      ziel:
        description: Zielbestand pro Kategorie und Quelle
        type: number
        default: 150
      max_artikel:
        description: Max. Wikipedia-Artikel pro Kategorie und Lauf (Kostenbremse)
        type: number
        default: 40
      modus:
        description: "Modus: ergaenzen (nur neue Fragen dazu) oder ersetzen (Wikidata-Fragen der Kategorie neu erzeugen; Wikipedia-Fragen bleiben immer)"
        type: choice
        default: ergaenzen
        options: [ergaenzen, ersetzen]
      trockenlauf:
        description: Trockenlauf (nur Stichprobe als Artifact, kein Pull Request)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # OIDC-Token für die Identitätsföderation mit Anthropic (WIF)

jobs:
  kategorien:
    runs-on: ubuntu-latest
    outputs:
      liste: ${{ steps.liste.outputs.liste }}
    steps:
      - id: liste
        run: |
          if [ "${{ inputs.kategorie }}" = "alle" ]; then
            echo 'liste=["naturwissenschaften","kunst","geschichte","sport","geografie","essen","natur","schweiz","starwars"]' >> "$GITHUB_OUTPUT"
          else
            echo 'liste=["${{ inputs.kategorie }}"]' >> "$GITHUB_OUTPUT"
          fi

  generieren:
    needs: kategorien
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2 # Wikimedia-APIs schonen
      matrix:
        kategorie: ${{ fromJSON(needs.kategorien.outputs.liste) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Generator installieren
        working-directory: generator
        run: pip install -e ".[llm,dev]"

      - name: HTTP-Cache wiederherstellen
        uses: actions/cache@v6
        with:
          path: generator/cache
          key: http-${{ matrix.kategorie }}-${{ github.run_id }}
          restore-keys: |
            http-${{ matrix.kategorie }}-
            http-

      - name: Fragen generieren
        working-directory: generator
        env:
          # Bevorzugt: Workload Identity Federation (Repository-Variablen, keine Secrets nötig).
          # Fallback: API-Key als Secret. Ist die Föderation konfiguriert, wird der Key nicht gesetzt,
          # weil ANTHROPIC_API_KEY sonst Vorrang hätte.
          WIF_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          WIF_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          WIF_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WIF_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          API_KEY_SECRET: ${{ secrets.ANTHROPIC_API_KEY }}
          WIKIQUIZ_GEN_MODEL: ${{ vars.WIKIQUIZ_GEN_MODEL }}
          WIKIQUIZ_CHECK_MODEL: ${{ vars.WIKIQUIZ_CHECK_MODEL }}
        run: |
          set -euo pipefail
          if [ -n "$WIF_RULE_ID" ]; then
            export ANTHROPIC_FEDERATION_RULE_ID="$WIF_RULE_ID"
            export ANTHROPIC_ORGANIZATION_ID="$WIF_ORGANIZATION_ID"
            export ANTHROPIC_SERVICE_ACCOUNT_ID="$WIF_SERVICE_ACCOUNT_ID"
            if [ -n "$WIF_WORKSPACE_ID" ]; then export ANTHROPIC_WORKSPACE_ID="$WIF_WORKSPACE_ID"; fi
            export ANTHROPIC_IDENTITY_TOKEN_FILE="$RUNNER_TEMP/gha-oidc.jwt"
            # GitHub-Tokens laufen nach ca. 5 Minuten ab und sind nur einmal eintauschbar.
            # Das SDK liest die Datei bei jeder Erneuerung neu, darum hier jede Minute ein frisches Token.
            token_holen() {
              curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
                | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE.neu"
              mv "$ANTHROPIC_IDENTITY_TOKEN_FILE.neu" "$ANTHROPIC_IDENTITY_TOKEN_FILE"
            }
            token_holen
            # Nicht geheime Angaben des Tokens ausgeben, um sie mit der Federation-Regel zu vergleichen
            python3 - "$ANTHROPIC_IDENTITY_TOKEN_FILE" <<'PY'
          import base64, json, sys
          teil = open(sys.argv[1]).read().strip().split(".")[1]
          c = json.loads(base64.urlsafe_b64decode(teil + "=" * (-len(teil) % 4)))
          print("GitHub-OIDC-Token:", json.dumps({k: c.get(k) for k in
                ("iss", "sub", "aud", "ref", "repository_owner", "event_name")}, indent=1))
          PY
            ( while sleep 60; do token_holen || echo "::warning::OIDC-Token konnte nicht erneuert werden"; done ) &
            ERNEUERUNG=$!
            trap 'kill $ERNEUERUNG 2>/dev/null || true' EXIT
            echo "Anthropic-Authentifizierung: Workload Identity Federation"
          elif [ -n "$API_KEY_SECRET" ]; then
            export ANTHROPIC_API_KEY="$API_KEY_SECRET"
            echo "Anthropic-Authentifizierung: API-Key (Secret)"
          else
            echo "::warning::Weder Föderation noch API-Key konfiguriert – die LLM-Pipeline wird fehlschlagen"
          fi
          python -m wikiquiz_gen generate \
            --kategorie "${{ matrix.kategorie }}" \
            --quelle "${{ inputs.quelle }}" \
            --ziel "${{ inputs.ziel }}" \
            --max-artikel "${{ inputs.max_artikel }}" \
            --modus "${{ inputs.modus }}" \
            ${{ inputs.trockenlauf && '--dry-run' || '' }}

      # Pull Requests, die mit GITHUB_TOKEN erstellt werden, lösen keine weiteren Workflows aus.
      # Darum laufen die Prüfungen hier.
      - name: Tests
        working-directory: generator
        run: python -m pytest -q

      - name: Fragen zusammenführen (prüft u. a. doppelte IDs)
        working-directory: app
        run: node scripts/fragen-zusammenfuehren.mjs

      - name: PR-Beschreibung
        run: |
          {
            echo "Automatisch erzeugte Fragen für **${{ matrix.kategorie }}** (Quelle: ${{ inputs.quelle }}, Modus: ${{ inputs.modus }}, Ziel ${{ inputs.ziel }}, max. ${{ inputs.max_artikel }} Artikel)."
            echo
            # Prüfliste vor der Stichprobe, damit sie beim Kürzen auf 60'000 Zeichen erhalten bleibt
            echo "## Prüfliste vor dem Mergen"
            echo
            echo "- [ ] Stichprobe durchgesehen: Fragen eindeutig, richtige Antwort stimmt, Distraktoren eindeutig falsch"
            echo "- [ ] Allgemeinwissen statt Nischenwissen, Schwierigkeit plausibel"
            echo "- [ ] Keine zeitabhängigen Fragen (amtierende Personen, aktuelle Rekorde)"
            echo "- [ ] Keine Dubletten zu bestehenden Fragen"
            echo "- [ ] \`rejected.jsonl\` überflogen: keine auffälligen Häufungen bei den Ablehnungsgründen"
            echo
            cat generator/out/zusammenfassung.md
            echo
            if [ -f "generator/out/review/${{ matrix.kategorie }}-neu.md" ]; then
              sed 's/^# /## /' "generator/out/review/${{ matrix.kategorie }}-neu.md"
            fi
            echo
            echo "Verworfene Kandidaten und Fragen mit Begründung: Artifact \`ausgabe-${{ matrix.kategorie }}\` (rejected.jsonl) im [Workflow-Lauf](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } | head -c 60000 > pr-text.md
          cat pr-text.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ausgabe-${{ matrix.kategorie }}
          path: generator/out/
          if-no-files-found: ignore

      # Nur vorhandene Dateien übergeben: data/verarbeitet/ entsteht nur bei Wikipedia-Läufen,
      # ein fehlender Pfad lässt „git add“ im nächsten Schritt scheitern.
      - name: Geänderte Dateien bestimmen
        id: dateien
        if: ${{ !inputs.trockenlauf }}
        run: |
          {
            echo "liste<<EOF"
            for f in "data/fragen/${{ matrix.kategorie }}.json" "data/verarbeitet/${{ matrix.kategorie }}.json"; do
              if [ -f "$f" ]; then echo "$f"; fi
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pull Request erstellen
        if: ${{ !inputs.trockenlauf }}
        uses: peter-evans/create-pull-request@v8
        with:
          branch: fragen/${{ matrix.kategorie }}-${{ github.run_number }}
          add-paths: ${{ steps.dateien.outputs.liste }}
          commit-message: "Neue Fragen: ${{ matrix.kategorie }}"
          title: "Neue Fragen: ${{ matrix.kategorie }} (Lauf ${{ github.run_number }})"
          body-path: pr-text.md
          labels: fragen
